# One SQL Server for all your .NET projects.
#   docker compose up -d                  start the server, then run every scripts/*.sql
#   docker compose logs sqlserver-init    see what the scripts did
#   docker compose stop                   stop (data is kept)
# Databases live in the "mssql-data" volume, so they survive container rebuilds.
# Only "docker volume rm mssql-data" deletes them.
name: sqlserver

# The SA password comes from .env (not committed). Start from .env.example.
x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # SQL Server has no ARM image; Docker Desktop runs it via Rosetta
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "127.0.0.1:1433:1433" # only this computer can connect, not others on your Wi-Fi
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Waits until the server is ready, runs scripts/*.sql in name order, then exits.
  # It runs on every "up", so scripts must be safe to re-run (use IF NOT EXISTS).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: *sa-password
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for f in /scripts/*.sql; do
          echo "Running $$f"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$f" || exit 1
        done
        echo "All scripts finished"
    restart: "no"

volumes:
  mssql-data:
    name: mssql-data # holds all your databases
