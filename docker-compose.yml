# One SQL Server for all your .NET projects.
#   docker compose up -d                      start the server and the scripts/ watcher
#   cat scripts-run.log                       see what the last save did
#   docker compose stop                       stop (data is kept)
# Databases live in the "mssql-data" volume, so they survive container rebuilds.
# Only "docker volume rm mssql-data" deletes them.
name: sqlserver

# The SA password comes from .env (not committed). Start from .env.example.
x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # SQL Server has no ARM image; Docker Desktop runs it via Rosetta
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "1433:1433" # all of the Mac's addresses, so the UTM Windows VM can use 192.168.64.1,1433
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Every time you save a file in scripts/, deletes DB_NAME and rebuilds it from scripts/*.sql.
  # Output of the last run goes to scripts-run.log. The logic is in sql-watch.sh.
  sqlserver-watch:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlserver-watch
    user: root # on Linux the image's own user (10001) can't write scripts-run.log into your folder
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: *sa-password
      DB_NAME: section_b
      TZ: ${TZ:-UTC} # timestamps in scripts-run.log
    volumes:
      - ./:/work # reads scripts/, writes scripts-run.log
    entrypoint: ["/bin/bash", "/work/sql-watch.sh"]
    restart: unless-stopped

volumes:
  mssql-data:
    name: mssql-data # holds all your databases
